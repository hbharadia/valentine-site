<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: linear-gradient(45deg, #ffe6e6, #ffb3ba, #ffcccc, #ffe6f7);
            background-size: 400% 400%;
            animation: gradientShift 4s ease infinite;
            color: #d63384;
            padding: 50px;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 {
            font-size: 2.5em;
            animation: bounce 2s infinite, colorChange 3s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        @keyframes colorChange {
            0% { color: #d63384; }
            25% { color: #ff69b4; }
            50% { color: #ff1493; }
            75% { color: #ffb3ba; }
            100% { color: #d63384; }
        }
        .photo-gallery {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none; /* Hidden initially */
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.5s ease;
            opacity: 0;
        }
        img.show {
            display: block;
            opacity: 1;
            animation: fadeIn 0.5s ease-in;
        }
        img:hover {
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        button {
            font-size: 1.2em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
        }
        #yesBtn {
            background-color: #ff69b4;
            color: white;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
            50% { transform: scale(1.05); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
            100% { transform: scale(1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        }
        #yesBtn:hover {
            background-color: #ff1493;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #ccc;
            color: black;
        }
        #noBtn:hover {
            background-color: #aaa;
            transform: scale(1.05);
        }
        #message {
            display: none;
            font-size: 1.5em;
            margin-top: 20px;
            animation: fadeIn 1s ease-in, heartBeat 1s infinite 1s;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 2em;
            animation: float 6s infinite linear, wiggle 2s infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff69b4;
            animation: confettiFall 3s ease-in-out infinite;
            display: none;
            border-radius: 50%;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .sparkle {
            position: absolute;
            font-size: 1.5em;
            color: #ffd700;
            animation: sparkle 1.5s ease-in-out infinite;
            display: none;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>Will You Be My Valentine? 💖</h1>
    <!-- Photo gallery -->
    <div class="photo-gallery">
        <img id="photo1" src="C:\Users\dikshita.oswal_jadeg\Desktop\TEST\P1.jpeg" alt="Romantic Photo 1">
        <img id="photo2" src="C:\Users\dikshita.oswal_jadeg\Desktop\TEST\P7.jpeg" alt="Romantic Photo 2">
        <img id="photo3" src="C:\Users\dikshita.oswal_jadeg\Desktop\TEST\P3.jpeg" alt="Romantic Photo 3">
        <img id="photo4" src="C:\Users\dikshita.oswal_jadeg\Desktop\TEST\P4.jpeg" alt="Romantic Photo 4">
        <img id="photo5" src="C:\Users\dikshita.oswal_jadeg\Desktop\TEST\P5.jpeg" alt="Romantic Photo 5"> 
    </div>
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
    <div id="message">
        <p>❤️ Oh, my heart is bursting with joy! You've made me the happiest person. I love you more than words can say. Happy Valentine's Day! ❤️</p>
    </div>

    <!-- Floating hearts animation with wiggle -->
    <div class="heart" style="left: 5%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 15%; animation-delay: 0.5s;">💖</div>
    <div class="heart" style="left: 25%; animation-delay: 1s;">💕</div>
    <div class="heart" style="left: 35%; animation-delay: 1.5s;">❤️</div>
    <div class="heart" style="left: 45%; animation-delay: 2s;">💖</div>
    <div class="heart" style="left: 55%; animation-delay: 2.5s;">💕</div>
    <div class="heart" style="left: 65%; animation-delay: 3s;">❤️</div>
    <div class="heart" style="left: 75%; animation-delay: 3.5s;">💖</div>
    <div class="heart" style="left: 85%; animation-delay: 4s;">💕</div>
    <div class="heart" style="left: 95%; animation-delay: 4.5s;">❤️</div>

    <!-- Confetti elements -->
    <div class="confetti" id="confetti1" style="left: 10%;"></div>
    <div class="confetti" id="confetti2" style="left: 30%; animation-delay: 0.2s;"></div>
    <div class="confetti" id="confetti3" style="left: 50%; animation-delay: 0.4s;"></div>
    <div class="confetti" id="confetti4" style="left: 70%; animation-delay: 0.6s;"></div>
    <div class="confetti" id="confetti5" style="left: 90%; animation-delay: 0.8s;"></div>

    <!-- Sparkles for extra magic -->
    <div class="sparkle" id="sparkle1" style="left: 20%; top: 20%;">✨</div>
    <div class="sparkle" id="sparkle2" style="left: 60%; top: 30%; animation-delay: 0.5s;">✨</div>
    <div class="sparkle" id="sparkle3" style="left: 40%; top: 50%; animation-delay: 1s;">✨</div>

    <script>
        let currentPhoto = 1;
        const totalPhotos = 5;

        document.getElementById('yesBtn').addEventListener('click', function() {
            document.getElementById('message').style.display = 'block';
            document.getElementById('yesBtn').style.display = 'none';
            document.getElementById('noBtn').style.display = 'none';
            // Show first photo
            document.getElementById('photo1').classList.add('show');
            // Trigger confetti burst
            const confettis = document.querySelectorAll('.confetti');
            confettis.forEach(confetti => {
                confetti.style.display = 'block';
            });
            // Trigger sparkles
            const sparkles = document.querySelectorAll('.sparkle');
            sparkles.forEach(sparkle => {
                sparkle.style.display = 'block';
            });
        });

        // Add click event to each photo to show the next one
        for (let i = 1; i <= totalPhotos; i++) {
            document.getElementById('photo' + i).addEventListener('click', function() {
                this.classList.remove('show'); // Hide current
                currentPhoto++;
                if (currentPhoto <= totalPhotos) {
                    document.getElementById('photo' + currentPhoto).classList.add('show'); // Show next
                }
            });
        }

        document.getElementById('noBtn').addEventListener('click', function() {
            alert("That's okay! Maybe next time? 😊");
        });

        // Make No button move on hover
        document.getElementById('noBtn').addEventListener('mouseover', function() {
            const button = this;
            const container = document.body;
            const maxX = container.clientWidth - button.offsetWidth;
            const maxY = container.clientHeight - button.offsetHeight;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
        });
    </script>
</body>
</html>
